<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Su-35 · 敌机模型预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#07121e;color:#dceaf3;font:14px system-ui}canvas{display:block;width:100vw;height:100vh}header{position:absolute;top:32px;left:36px;pointer-events:none}small{color:#f18a82;letter-spacing:3px}h1{font-size:38px;margin:8px 0}p{color:#9eafc0;line-height:1.8;max-width:430px}nav{position:absolute;bottom:30px;left:36px;display:flex;flex-wrap:wrap;gap:8px}button,a{border:1px solid #42596b;border-radius:6px;background:#102638;color:#c6dfeb;padding:10px 17px;text-decoration:none;cursor:pointer}button[aria-pressed=true]{border-color:#88e4d7;color:#88e4d7}.note{position:absolute;right:30px;bottom:34px;font:11px monospace;color:#83a1b3}@media(max-width:600px){header{left:20px;top:20px}h1{font-size:27px}p{font-size:12px;max-width:290px}nav{left:20px;bottom:24px}.note{display:none}}
</style></head><body><canvas id="preview" aria-label="Su-35风格敌方战机三维模型"></canvas><header><small>HOSTILE AIRCRAFT / 02</small><h1>SU-35 · FLANKER</h1><p>双发机身 · 后掠机翼 · 双垂尾<br>蓝灰金属涂装与红色敌方识别标记</p></header><nav aria-label="模型视角"><button data-view="front" aria-pressed="true">前侧</button><button data-view="top" aria-pressed="false">俯视</button><button data-view="rear" aria-pressed="false">后侧</button><button id="rotate" aria-pressed="false">自动旋转</button><a href="./">返回游戏</a></nav><div class="note">ORIGINAL GAME ASSET / SU-35 INSPIRED</div><script type="module">
import * as T from './vendor/three.module.js';
import {createEnemyAircraft} from './enemy-model.js';
const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setClearColor(0x07121e);renderer.toneMapping=T.ACESFilmicToneMapping;
const scene=new T.Scene(),camera=new T.PerspectiveCamera(38,1,.1,60);scene.add(new T.HemisphereLight(0xd9f2ff,0x334762,3));
for(const [x,y,z,color,power] of [[-5,7,5,0xc1e8ff,4],[5,3,-5,0xffd2a1,3]]){const light=new T.DirectionalLight(color,power);light.position.set(x,y,z);scene.add(light);}
const studio=new T.Scene();studio.background=new T.Color(0x344a5d);for(const [x,y,z] of [[-6,4,0],[6,4,0],[0,4,-6]]){const panel=new T.Mesh(new T.PlaneGeometry(5,12),new T.MeshBasicMaterial({color:0xb1d9ee,side:T.DoubleSide}));panel.position.set(x,y,z);panel.lookAt(0,0,0);studio.add(panel);}const generator=new T.PMREMGenerator(renderer),environment=generator.fromScene(studio,.04);scene.environment=environment.texture;generator.dispose();studio.traverse(o=>{o.geometry?.dispose();o.material?.dispose();});
const model=createEnemyAircraft();scene.add(model);const grid=new T.GridHelper(18,36,0x304a5c,0x112b3b);grid.position.y=-.7;scene.add(grid);
let rotating=false,last=performance.now();
function view(name){model.rotation.y=0;camera.up.set(0,1,0);camera.position.set(...({front:[4.2,3.3,6],top:[0,9,.001],rear:[-5,3,-7]}[name]));camera.lookAt(0,.05,0);for(const button of document.querySelectorAll('[data-view]'))button.setAttribute('aria-pressed',String(button.dataset.view===name));}
for(const button of document.querySelectorAll('[data-view]'))button.onclick=()=>view(button.dataset.view);
document.getElementById('rotate').onclick=e=>{rotating=!rotating;e.target.setAttribute('aria-pressed',String(rotating));};
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}window.addEventListener('resize',resize);resize();view('front');
function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.05);last=now;if(rotating&&!document.hidden)model.rotation.y+=dt*.3;if(!document.hidden)renderer.render(scene,camera);}requestAnimationFrame(animate);
</script></body></html>
