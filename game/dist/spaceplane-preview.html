</style></head><body><canvas id="preview" aria-label="玄女空天战机三维外观重建，细长机头、前掠翼、黑白装甲与橙黄翼尖"></canvas><header><small>SPACE FIGHTER / PHOTO STUDY</small><h1>玄女 <span>XUAN NV</span></h1><p>抬高翼座 · 前掠主翼 · 黑白装甲<br>细长机头 / 独立模型预览</p></header><div class="spec">XUAN NV<br><b>EXTERIOR RECONSTRUCTION</b><br>PREVIEW ONLY</div><a class="reference" href="https://tao.hooos.com/goods_YgY70JjuptXDWwBk2zfW7YT2t6-aAZjjVSda9OoWDgIa.html" target="_blank" rel="noopener noreferrer">查看商品参考 ↗</a><div class="note">依据商品照片重建外观。<br>图片未展示的细节采用近似表达，<br>按商品标称长宽高比例重建；<br>尾焰为演示效果。</div><div class="help" id="view-help">拖动旋转 · 滚轮缩放 · 正交视角查看主翼与机身高度</div><nav aria-label="模型控制"><button data-view="front" aria-pressed="true">前侧</button><button data-view="rear" aria-pressed="false">后侧</button><button data-view="side" aria-pressed="false">正侧视</button><button data-view="head" aria-pressed="false">正前视</button><button data-view="top" aria-pressed="false">正俯视</button><button data-view="engine" aria-pressed="false">尾部特写</button><button id="flame" aria-pressed="false">尾焰演示</button><button id="rotate" aria-pressed="false">自动旋转</button><a href="./">返回游戏</a></nav><div id="error" class="error" hidden></div><script type="module">
import * as T from './vendor/three.module.js';
import {createSpaceplane,updateSpaceplane} from './spaceplane-model.js';
const canvas=document.querySelector('canvas');
try {
const renderer=new T.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setClearColor(0x050b13);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=.94;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene(),perspective=new T.PerspectiveCamera(38,1,.1,200),orthographic=new T.OrthographicCamera(-10,10,10,-10,.1,200);
let camera=perspective,orthoWidth=20,orthoHeight=7,orthoZoom=1;
scene.add(new T.HemisphereLight(0xd3edff,0x17202c,1.35));
for(const [x,y,z,color,power] of [[-10,14,3,0xe5f4ff,2.8],[9,5,10,0x80c9ff,2.1],[3,8,-12,0xffd3a1,2.1]]){const l=new T.DirectionalLight(color,power);l.position.set(x,y,z);if(x===-10){l.castShadow=true;l.shadow.mapSize.set(2048,2048);Object.assign(l.shadow.camera,{left:-12,right:12,top:12,bottom:-12,near:.5,far:45});l.shadow.camera.updateProjectionMatrix();l.shadow.bias=-.00008;l.shadow.normalBias=.018;l.shadow.radius=2;}scene.add(l);}
const studio=new T.Scene();studio.background=new T.Color(0x263745);
for(const [x,y,z,w,h,color] of [[-10,7,0,5,20,0x9bc6df],[10,3,2,4,16,0xb1d5e5],[0,8,-10,12,6,0xeee1c8]]){const m=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({color,side:T.DoubleSide}));m.position.set(x,y,z);m.lookAt(0,0,0);studio.add(m);}
const pmrem=new T.PMREMGenerator(renderer),env=pmrem.fromScene(studio,.05);scene.environment=env.texture;pmrem.dispose();studio.traverse(o=>{o.geometry?.dispose();o.material?.dispose();});
const ship=createSpaceplane();scene.add(ship);
const grid=new T.GridHelper(60,60,0x193345,0x0b1b29);grid.position.y=-2.5;scene.add(grid);
let ignited=false,rotating=false,yaw=0,pitch=.45,distance=29,time=0,last=performance.now(),drag=null;
const target=new T.Vector3(0,0,0);
function projection(){
  const aspect=innerWidth/innerHeight;
  perspective.aspect=aspect;perspective.updateProjectionMatrix();
  const height=Math.max(orthoHeight,orthoWidth/aspect)*orthoZoom;
  orthographic.left=-height*aspect/2;orthographic.right=height*aspect/2;
  orthographic.top=height/2;orthographic.bottom=-height/2;orthographic.updateProjectionMatrix();
}
function cameraPose(){camera.position.set(target.x+Math.sin(yaw)*Math.cos(pitch)*distance,target.y+Math.sin(pitch)*distance,target.z+Math.cos(yaw)*Math.cos(pitch)*distance);camera.lookAt(target);}
function view(name){
  target.set(0,.1,-.4);ship.rotation.y=0;distance=25;pitch=.39;yaw=.72;camera=perspective;orthoZoom=1;
  rotating=false;document.getElementById('rotate').setAttribute('aria-pressed','false');
  if(name==='front')yaw=2.62;
  if(name==='side'){camera=orthographic;target.set(0,.075,0);yaw=Math.PI/2;pitch=0;orthoWidth=21;orthoHeight=7;}
  if(name==='head'){camera=orthographic;target.set(0,.075,0);yaw=Math.PI;pitch=0;orthoWidth=14;orthoHeight=7;}
  if(name==='top'){camera=orthographic;target.set(0,0,.1);yaw=0;pitch=Math.PI/2-.0001;orthoWidth=14;orthoHeight=22;}
  if(name==='engine'){target.set(0,0,6.5);yaw=.25;pitch=.28;distance=13.5;}
  for(const b of document.querySelectorAll('[data-view]'))b.setAttribute('aria-pressed',String(b.dataset.view===name));
  document.getElementById('view-help').textContent=camera===orthographic?'正交投影 · 滚轮缩放 · 拖动查看高度与厚度':'拖动旋转 · 滚轮缩放 · 正交视角查看主翼与机身高度';
  projection();cameraPose();
}
for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>view(b.dataset.view);
document.getElementById('flame').onclick=e=>{ignited=!ignited;e.target.setAttribute('aria-pressed',String(ignited));};
document.getElementById('rotate').onclick=e=>{rotating=!rotating;e.target.setAttribute('aria-pressed',String(rotating));};
canvas.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);};
canvas.onpointermove=e=>{if(!drag)return;yaw-=(e.clientX-drag.x)*.006;pitch=T.MathUtils.clamp(pitch+(e.clientY-drag.y)*.006,-1.3,1.56);drag={x:e.clientX,y:e.clientY};cameraPose();};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;
canvas.onwheel=e=>{e.preventDefault();const factor=Math.exp(e.deltaY*.001);if(camera===orthographic){orthoZoom=T.MathUtils.clamp(orthoZoom*factor,.3,2.5);projection();}else distance=T.MathUtils.clamp(distance*factor,6,55);cameraPose();};
function resize(){projection();renderer.setSize(innerWidth,innerHeight);}addEventListener('resize',resize);resize();view('front');
let frame;function animate(now){frame=requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.05);last=now;if(document.hidden)return;time+=dt;if(rotating&&!drag){yaw+=dt*.19;cameraPose();}updateSpaceplane(ship,time,ignited);renderer.render(scene,camera);}frame=requestAnimationFrame(animate);
addEventListener('pagehide',()=>{cancelAnimationFrame(frame);const geometries=new Set(),materials=new Set(),textures=new Set();scene.traverse(o=>{if(o.isLight)o.dispose?.();if(o.geometry)geometries.add(o.geometry);if(o.material)for(const m of Array.isArray(o.material)?o.material:[o.material])materials.add(m);});geometries.forEach(g=>g.dispose());materials.forEach(m=>{for(const value of Object.values(m))if(value?.isTexture)textures.add(value);m.dispose();});textures.forEach(t=>t.dispose());env.dispose();renderer.dispose();},{once:true});
} catch(e){document.getElementById('error').hidden=false;document.getElementById('error').textContent='模型预览无法启动：'+e.message;}
</script><script type="module" src="./lifecycle.js"></script></body></html>
