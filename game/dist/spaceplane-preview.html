<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星隼 ORION · 太空飞机</title><style>
*{box-sizing:border-box}body{margin:0;background:#050b13;color:#e7f1f5;font:14px "Segoe UI","Microsoft YaHei",sans-serif}canvas{display:block;width:100vw;height:100dvh;touch-action:none}header{position:absolute;top:34px;left:38px;pointer-events:none}small{color:#6bcbdc;font:10px monospace;letter-spacing:4px}h1{font-size:40px;letter-spacing:4px;margin:10px 0}h1 span{font-weight:300;color:#99adb9}header p{color:#829aa8;line-height:1.8;font-size:12px}nav{position:absolute;bottom:30px;left:38px;right:38px;display:flex;flex-wrap:wrap;gap:8px}button,a{font:inherit;text-decoration:none;color:#acc3cf;background:#0d1d2bdb;border:1px solid #294553;border-radius:5px;padding:11px 17px;cursor:pointer}button[aria-pressed=true]{color:#a9efff;border-color:#7cd5e6;background:#133240}button:focus-visible,a:focus-visible{outline:2px solid #a9efff;outline-offset:3px}.spec{position:absolute;right:38px;top:38px;text-align:right;color:#6d8697;font:10px monospace;line-height:2;letter-spacing:2px}.spec b{color:#c4dce6;font-weight:400}.help{position:absolute;bottom:92px;left:38px;color:#587380;font-size:11px}.error{position:absolute;top:45%;left:10%;right:10%;color:#ffc28a}@media(max-width:650px){header{top:22px;left:22px}h1{font-size:27px}.spec{display:none}nav{left:22px;right:22px;bottom:20px}button,a{padding:9px 12px;font-size:12px}.help{left:22px;bottom:110px}}
</style></head><body><canvas id="preview" aria-label="星隼太空飞机三维模型，带中央超大喷口"></canvas><header><small>ORBITAL CRAFT / CONCEPT 01</small><h1>星隼 <span>ORION</span></h1><p>宽体装甲 · 短后掠翼 · 三联推进系统<br>中央超大主喷口 / 双辅助推进器</p></header><div class="spec">DESIGN STUDY<br><b>ION DRIVE / XL</b><br>PREVIEW ONLY</div><div class="help">拖动旋转 · 滚轮缩放 · 切换视角查看喷口结构</div><nav aria-label="模型控制"><button data-view="rear" aria-pressed="true">后侧</button><button data-view="front" aria-pressed="false">前侧</button><button data-view="top" aria-pressed="false">俯视</button><button data-view="engine" aria-pressed="false">喷口特写</button><button id="flame" aria-pressed="true">尾焰</button><button id="rotate" aria-pressed="false">自动旋转</button><a href="./">返回游戏</a></nav><div id="error" class="error" hidden></div><script type="module">
import * as T from './vendor/three.module.js';
import {createSpaceplane,updateSpaceplane} from './spaceplane-model.js';
const canvas=document.querySelector('canvas');
try {
const renderer=new T.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setClearColor(0x050b13);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
const scene=new T.Scene(),camera=new T.PerspectiveCamera(38,1,.1,200);
scene.add(new T.HemisphereLight(0xd3edff,0x17202c,1.65));
for(const [x,y,z,color,power] of [[-10,14,3,0xe5f4ff,3.7],[9,5,10,0x80c9ff,2.7],[3,8,-12,0xffd3a1,2.8]]){const l=new T.DirectionalLight(color,power);l.position.set(x,y,z);scene.add(l);}
const studio=new T.Scene();studio.background=new T.Color(0x263745);
for(const [x,y,z,w,h,color] of [[-10,7,0,5,20,0x9bc6df],[10,3,2,4,16,0xb1d5e5],[0,8,-10,12,6,0xeee1c8]]){const m=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({color,side:T.DoubleSide}));m.position.set(x,y,z);m.lookAt(0,0,0);studio.add(m);}
const pmrem=new T.PMREMGenerator(renderer),env=pmrem.fromScene(studio,.05);scene.environment=env.texture;pmrem.dispose();studio.traverse(o=>{o.geometry?.dispose();o.material?.dispose();});
const ship=createSpaceplane();scene.add(ship);
const grid=new T.GridHelper(60,60,0x193345,0x0b1b29);grid.position.y=-2.5;scene.add(grid);
let ignited=true,rotating=false,yaw=0,pitch=.45,distance=29,time=0,last=performance.now(),drag=null;
const target=new T.Vector3(0,0,0);
function cameraPose(){camera.position.set(target.x+Math.sin(yaw)*Math.cos(pitch)*distance,target.y+Math.sin(pitch)*distance,target.z+Math.cos(yaw)*Math.cos(pitch)*distance);camera.lookAt(target);}
function view(name){target.set(0,0,0);ship.rotation.y=0;distance=29;pitch=.46;yaw=.72;if(name==='front')yaw=2.5;if(name==='top'){yaw=0;pitch=1.56;distance=29;}if(name==='engine'){target.set(0,-.2,5.2);yaw=.22;pitch=.13;distance=11.5;}for(const b of document.querySelectorAll('[data-view]'))b.setAttribute('aria-pressed',String(b.dataset.view===name));cameraPose();}
for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>view(b.dataset.view);
document.getElementById('flame').onclick=e=>{ignited=!ignited;e.target.setAttribute('aria-pressed',String(ignited));};
document.getElementById('rotate').onclick=e=>{rotating=!rotating;e.target.setAttribute('aria-pressed',String(rotating));};
canvas.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);};
canvas.onpointermove=e=>{if(!drag)return;yaw-=(e.clientX-drag.x)*.006;pitch=T.MathUtils.clamp(pitch+(e.clientY-drag.y)*.006,-1.3,1.56);drag={x:e.clientX,y:e.clientY};cameraPose();};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;
canvas.onwheel=e=>{e.preventDefault();distance=T.MathUtils.clamp(distance*Math.exp(e.deltaY*.001),6,55);cameraPose();};
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}addEventListener('resize',resize);resize();view('rear');
let frame;function animate(now){frame=requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.05);last=now;if(document.hidden)return;time+=dt;if(rotating&&!drag){yaw+=dt*.19;cameraPose();}updateSpaceplane(ship,time,ignited);renderer.render(scene,camera);}frame=requestAnimationFrame(animate);
addEventListener('pagehide',()=>{cancelAnimationFrame(frame);const geometries=new Set(),materials=new Set();scene.traverse(o=>{if(o.geometry)geometries.add(o.geometry);if(o.material)materials.add(o.material);});geometries.forEach(g=>g.dispose());materials.forEach(m=>m.dispose());env.dispose();renderer.dispose();},{once:true});
} catch(e){document.getElementById('error').hidden=false;document.getElementById('error').textContent='模型预览无法启动：'+e.message;}
</script><script type="module" src="./lifecycle.js"></script></body></html>
